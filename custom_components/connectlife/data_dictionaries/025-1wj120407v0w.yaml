# Washing machine
properties:
  # ==========================================
  # PROGRAMMER & INDSTILLINGER (Selects)
  # ==========================================

  # Valg af Vaskeprogram
  - property: Selected_program_ID
    select:
      options:
        6: "Tromlerengøring"
        7: "Bomuld"
        8: "Syntetisk"
        9: "ECO 40-60"
        10: "Uld"
        11: "Hurtig 15´"
        12: "Mix"
        14: "Centrifugering"
        15: "Allergipleje"
        16: "Babytøj"
        17: "Mørk Vask"
        18: "Sportstøj"
        20: "Rinse+Spin"
        21: "Silke / Delikat"
        24: "Skjorter"
        44: "Sengetøj"
        45: "Jeans"
        49: "Daglig Vask"
        51: "AI Supervask"
        52: "Effekt: Hastighed 39´"

  - property: Softener
    icon: mdi:flower-tulip-outline
    select:
      options:
        0: "Fra"
        1: Auto
        2: Mindre
        3: Normal
        4: Mere

  - property: Detergent
    icon: mdi:chart-bubble
    select:
      options:
        0: "Fra"
        1: Auto
        2: Mindre
        3: Normal
        4: Mere

  - property: DownLight
    icon: mdi:lightbulb
    entity_category: config
    switch:

  - property: Stain_removal
    icon: mdi:flower-tulip-outline
    entity_category: config
    select:
      options:
        0: "off"
        1: Vin
        2: Græs
        3: Jord
        4: Kaffe
        5: Mælk
        6: Juice
        7: Sved
        8: Blod
        9: Olie

  - property: Current_program_phase
    sensor:
      read_only: true
      device_class: enum
      options:
        0: not_available
        1: Vejer
        2: Forvask
        3: Vasker
        4: Skyller
        5: Forvarmning Færdig
        7: Centrifugerer
        10: Vask Afsluttet
        11: Tidsforskydning Venter

  - property: ApplicationPermissions
    hide: false
    sensor:
      read_only: true
      device_class: enum
      options:
        0: "disabled"
        1: "enabled"
        2: "not_granted"
        3: "granted"

  - property: DrumCleanCycle_RunsNumber
    entity_category: config
    optional: true
    icon: mdi:washing-machine
    select:
      options:
        10: "10 X"
        15: "15 X"
        20: "20 X"
        25: "25 X"
        30: "30 X"
        35: "35 X"
        40: "40 X"
        45: "45 X"
        50: "50 X"
        55: "55 X"
        60: "60 X"
        65: "65 X"
        70: "70 X"
        75: "75 X"
        80: "80 X"
        85: "85 X"
        90: "90 X"
        95: "95 X"
        100: "100 X"

  - property: ScreenSaverTime
    entity_category: config
    optional: true
    icon: mdi:timer-sand
    select:
      options:
        2: "2 min"
        4: "4 min"
        6: "6 min"

  - property: DownLight_LightTime
    entity_category: config
    optional: true
    icon: mdi:timer-sand
    select:
      options:
        1: "1 min"
        2: "2 min"
        3: "3 min"
